<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satisfacción del cliente · SGC Silver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <div class="brand"><small>SGC Silver Industrial · ISO 9001</small><h2>Satisfacción del cliente</h2></div>
    <label for="clave" class="det">Clave de administrador</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="pri" type="submit">Entrar</button>
  </form>
</div>
<header class="top">
  <div class="top-in">
    <div class="brand"><small>SGC Silver Industrial · ISO 9001 · 9.1.2</small><h1>Satisfacción del cliente</h1></div>
    <div class="spacer"></div>
    <div class="ctl">
      <span class="status" id="status" role="status"></span>
      <label for="env" class="det">Enviadas</label>
      <input id="env" type="number" min="0" value="0" class="envin" title="Cantidad de encuestas enviadas (carga manual)">
      <label for="year" class="det">Encuesta</label>
      <select id="year" aria-label="Encuesta"></select>
      <button id="btnNueva" title="Crea la encuesta de otro año con los mismos pesos y meta">Nueva</button>
      <input id="csv" type="file" accept=".csv,text/csv,.txt" hidden>
      <button id="btnCsv" class="pri" title="Subí el CSV descargado de la hoja de respuestas del formulario">Cargar encuestas (CSV)</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<footer><span>Desarrollado por Mgter. Diego Ortiz — Líder de Mejora Continua | Consultor ISO</span><span>ISO 9001 9.1.2 · RxD 9.3.2 · Apéndice C</span></footer>
<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
